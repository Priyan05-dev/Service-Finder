<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ServiceFinder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <div class="brand"><a href="/" style="color:black; text-decoration:none;">ServiceFinder</a></div>
    <div>{{ navbar|safe }}</div>
</div>

<div class="container">
    {{ flash_html|safe }}

    <h2>Find a Service Provider</h2>
    <form method="POST">
        <label>Select Service</label>
        <select name="service" required>
            {{ services_options|safe }}
        </select>

        <label>Select Region / City</label>
        <select name="region" required>
            {{ region_options|safe }}
        </select>

        <button type="submit">Search</button>
    </form>
</div>

<script src="/static/script.js"></script>
</body>
</html>
