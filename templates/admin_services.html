<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ServiceFinder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <div class="brand"><a href="/" style="color:black; text-decoration:none;">ServiceFinder</a></div>
    <div>{{ navbar|safe }}</div>
</div>

<div class="container">
    {{ flash_html|safe }}

    <h2>Manage Services</h2>

    <form method="POST">
        <label>Add New Service</label>
        <input type="text" name="service_name" placeholder="e.g. Roofing" required>
        <button type="submit">Add Service</button>
    </form>

    <h3 style="margin-top:25px;">Current Services</h3>
    {{ services_table|safe }}
</div>

<script src="/static/script.js"></script>
</body>
</html>
