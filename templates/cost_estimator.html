<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ServiceFinder</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <div class="brand"><a href="/" style="color:black; text-decoration:none;">ServiceFinder</a></div>
    <div>{{ navbar|safe }}</div>
</div>

<div class="container">
    {{ flash_html|safe }}

    <h2>Cost Estimator</h2>
    <p class="small-text">Select the service and describe your problem, and we'll give you a rough cost estimate
        (this includes the provider's fee and any equipment/parts that may need replacing).</p>

    <form method="POST">
        <label>Service Category</label>
        <select name="service" required>
            {{ services_options|safe }}
        </select>

        <label>Describe the problem</label>
        <textarea name="problem" placeholder="e.g. ac is not cooling and making noise">{{ user_text }}</textarea>

        <button type="submit">Estimate Cost</button>
    </form>

    {{ result_html|safe }}
</div>

<script src="/static/script.js"></script>
</body>
</html>
